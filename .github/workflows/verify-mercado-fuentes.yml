name: Verificar fuentes de mercado (A0 · MINVU Hub/ArcGIS)

# Paso A0 (Fase 2) SIN terminal: corre scraper/a0-verify-fuentes.mjs EN EL VPS
# (que sí tiene salida a ide.minvu.cl, a diferencia del sandbox de build).
#
# DESCUBRIMIENTO (2026-07-12): ide.minvu.cl es un portal Esri ArcGIS Hub, no un
# GeoServer WFS clásico. Por eso el modo por defecto es --search (busca datasets
# en el Hub) y --esri-describe (lista campos de un FeatureServer/MapServer).
# --wfs/--describe quedan como fallback explícito por si hace falta apuntar a
# otro portal que sí sea GeoServer clásico.
#
# Mismo patrón que scrape-sii-mapasui.yml: SSH al VPS, correr ahí. Es de solo
# lectura (no escribe en la BD). Se lanza desde Actions → Run workflow (o push
# al centinela scraper/.verify-mercado-fuentes, porque la API de GitHub de este
# entorno no permite disparar workflow_dispatch).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de búsqueda"
        required: true
        default: "search"
        type: choice
        options:
          - search
          - auto_find_valor
          - esri_describe
          - wfs
      search:
        description: "(modo=search) Término de búsqueda de datasets. Ej: 'valor de suelo'"
        required: false
        default: "valor de suelo"
      esri_describe:
        description: "(modo=esri_describe) URL del FeatureServer/MapServer para listar campos"
        required: false
        default: ""
      hub_url:
        description: "URL base del portal Hub (default: MINVU IDE)"
        required: false
        default: "https://ide.minvu.cl"
      layer:
        description: "(modo=wfs) Capa a describir. VACÍO = listar capas"
        required: false
        default: ""
      wfs_url:
        description: "(modo=wfs) URL base del WFS"
        required: false
        default: "https://ide.minvu.cl/geoserver/wfs"
  push:
    branches:
      - main
    paths:
      - 'scraper/.verify-mercado-fuentes'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Correr A0 en el VPS (búsqueda / auto-find / describe / WFS)
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s << EOF
            set -e
            cd /opt/casafari/scraper
            MODE="${{ github.event.inputs.mode || 'search' }}"
            case "\$MODE" in
              auto_find_valor)
                node a0-verify-fuentes.mjs --hub-url "${{ github.event.inputs.hub_url || 'https://ide.minvu.cl' }}" \
                  --auto-find-valor
                ;;
              esri_describe)
                node a0-verify-fuentes.mjs --hub-url "${{ github.event.inputs.hub_url || 'https://ide.minvu.cl' }}" \
                  --esri-describe "${{ github.event.inputs.esri_describe }}"
                ;;
              wfs)
                WFS="${{ github.event.inputs.wfs_url || 'https://ide.minvu.cl/geoserver/wfs' }}"
                LAYER="${{ github.event.inputs.layer }}"
                if [ -n "\$LAYER" ]; then
                  node a0-verify-fuentes.mjs --wfs-url "\$WFS" --describe "\$LAYER"
                else
                  node a0-verify-fuentes.mjs --wfs --wfs-url "\$WFS"
                fi
                ;;
              search|*)
                node a0-verify-fuentes.mjs --hub-url "${{ github.event.inputs.hub_url || 'https://ide.minvu.cl' }}" \
                  --search "${{ github.event.inputs.search || 'valor de suelo' }}"
                ;;
            esac
          EOF

      - name: Resumen
        run: |
          echo "✓ A0 completado. Próximos pasos según el modo:"
          echo ""
          echo "Si usaste mode=search:"
          echo "  1) Anotá la URL del servicio (FeatureServer/MapServer) del dataset correcto"
          echo "  2) Relanzá con mode=esri_describe + esa URL para ver sus campos"
          echo "  3) Lanzá 'Ingesta valor de suelo MINVU' con esos flags"
          echo ""
          echo "Si usaste mode=auto_find_valor:"
          echo "  • A0 inspecciona todos los datasets y sugiere el comando ingest-minvu-suelo.mjs"
          echo "  • Si encuentra coincidencias, copiá el comando y lanzá 'Ingesta valor de suelo MINVU'"
          echo "  • Si no encuentra nada, probá otros portales (geoportal.cl, catastral.cl)"
          echo ""
          echo "Si usaste mode=esri_describe:"
          echo "  • Viste los campos del dataset y el comando sugerido"
          echo "  • Lanzá 'Ingesta valor de suelo MINVU' con esos flags"
          echo ""
          echo "Si usaste mode=wfs:"
          echo "  • WFS clásico (GeoServer) de otro portal"
          echo "  • Completá describiendo la capa y copiando el comando sugerido"
