name: Verificar fuentes de mercado (A0 · MINVU/SII/CBR)

# Paso A0 (Fase 2) SIN terminal: corre las sondas de fuentes EN EL VPS (que sí
# tiene salida a ide.minvu.cl / sii.cl / datos.gob.cl, a diferencia del sandbox
# de build). Solo lectura, no escribe en la BD.
#
# Modos:
#   auto_find_valor — crawlea el Hub MINVU capa por capa buscando campos de
#                     valor de suelo (v2: los fields viven en …/FeatureServer/<n>,
#                     no en la raíz — el run v1 del 2026-07-13 fue inconcluso).
#   sii_ckan        — Fase 2 parte 2: páginas de estadísticas del SII (¿transferencias
#                     o solo avalúo?), Observatorio Urbano MINVU y CKAN datos.gob.cl.
#   cbr_probe       — Fase 6: sonda el portal del Índice de Propiedad CBR y extrae
#                     formularios/endpoints/iframes para fijar --search-url.
#   search / esri_describe / wfs — modos manuales del Hub y fallback GeoServer.
#
# Mismo patrón que scrape-sii-mapasui.yml: SSH al VPS, correr ahí. Se lanza desde
# Actions → Run workflow (o push al centinela scraper/.verify-mercado-fuentes).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de búsqueda (all = las 3 sondas de una vez)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - auto_find_valor
          - sii_ckan
          - cbr_probe
          - search
          - esri_describe
          - wfs
      search:
        description: "(modo=search) Término de búsqueda de datasets. Ej: 'valor de suelo'"
        required: false
        default: "valor de suelo"
      esri_describe:
        description: "(modo=esri_describe) URL del FeatureServer/MapServer para listar campos"
        required: false
        default: ""
      probe_url:
        description: "(modo=cbr_probe) URL del portal CBR a sondear"
        required: false
        default: "https://conservadoresdigitales.cl"
      hub_url:
        description: "URL base del portal Hub (default: MINVU IDE)"
        required: false
        default: "https://ide.minvu.cl"
      layer:
        description: "(modo=wfs) Capa a describir. VACÍO = listar capas"
        required: false
        default: ""
      wfs_url:
        description: "(modo=wfs) URL base del WFS"
        required: false
        default: "https://ide.minvu.cl/geoserver/wfs"
  push:
    branches:
      - main
    paths:
      - 'scraper/.verify-mercado-fuentes'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Copia las sondas directo del checkout: elimina la carrera con deploy.yml
      # (el primer run de A0 corrió ANTES de que el rsync del deploy llegara al VPS).
      - name: Sincronizar sondas al VPS
        run: |
          scp -i ~/.ssh/deploy_key -P "${{ secrets.VPS_PORT || 22 }}" \
            scraper/a0-verify-fuentes.mjs scraper/a0-verify-sii.mjs scraper/cbr-indice-cl.mjs \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/casafari/scraper/"

      - name: Correr A0 en el VPS (all / auto-find / sii_ckan / cbr_probe / describe / WFS)
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s << EOF
            set -e
            cd /opt/casafari/scraper
            MODE="${{ github.event.inputs.mode || 'all' }}"
            case "\$MODE" in
              all)
                echo "════════ 1/3 · auto_find_valor (Hub MINVU capa por capa) ════════"
                node a0-verify-fuentes.mjs --hub-url "${{ github.event.inputs.hub_url || 'https://ide.minvu.cl' }}" \
                  --auto-find-valor || echo "✗ auto_find_valor terminó con error (sigo con las demás sondas)"
                echo ""
                echo "════════ 2/3 · sii_ckan (SII + Observatorio Urbano + datos.gob.cl) ════════"
                node a0-verify-sii.mjs || echo "✗ sii_ckan terminó con error (sigo)"
                echo ""
                echo "════════ 3/3 · cbr_probe (portal Índice de Propiedad) ════════"
                node cbr-indice-cl.mjs --probe \
                  --probe-url "${{ github.event.inputs.probe_url || 'https://conservadoresdigitales.cl' }}" \
                  || echo "✗ cbr_probe terminó con error"
                ;;
              auto_find_valor)
                node a0-verify-fuentes.mjs --hub-url "${{ github.event.inputs.hub_url || 'https://ide.minvu.cl' }}" \
                  --auto-find-valor
                ;;
              sii_ckan)
                node a0-verify-sii.mjs
                ;;
              cbr_probe)
                node cbr-indice-cl.mjs --probe \
                  --probe-url "${{ github.event.inputs.probe_url || 'https://conservadoresdigitales.cl' }}"
                ;;
              esri_describe)
                node a0-verify-fuentes.mjs --hub-url "${{ github.event.inputs.hub_url || 'https://ide.minvu.cl' }}" \
                  --esri-describe "${{ github.event.inputs.esri_describe }}"
                ;;
              wfs)
                WFS="${{ github.event.inputs.wfs_url || 'https://ide.minvu.cl/geoserver/wfs' }}"
                LAYER="${{ github.event.inputs.layer }}"
                if [ -n "\$LAYER" ]; then
                  node a0-verify-fuentes.mjs --wfs --wfs-url "\$WFS" --describe "\$LAYER"
                else
                  node a0-verify-fuentes.mjs --wfs --wfs-url "\$WFS"
                fi
                ;;
              search|*)
                node a0-verify-fuentes.mjs --hub-url "${{ github.event.inputs.hub_url || 'https://ide.minvu.cl' }}" \
                  --search "${{ github.event.inputs.search || 'valor de suelo' }}"
                ;;
            esac
          EOF

      - name: Resumen
        run: |
          echo "✓ A0 completado. Próximo paso según el modo:"
          echo ""
          echo "auto_find_valor → si hay candidatas, copiá el comando sugerido y lanzá"
          echo "  'Ingesta valor de suelo MINVU'. Si el resumen dice PARCIAL, relanzá."
          echo "  Si terminó completo sin candidatas: el dato NO está en ide.minvu.cl →"
          echo "  correr mode=sii_ckan (lo busca en datos.gob.cl / Observatorio Urbano)."
          echo ""
          echo "sii_ckan → anotar URLs/formatos reales de los archivos hallados y documentar"
          echo "  en docs/RUNBOOK-MERCADO-CL.md; cargar con los importadores CSV de la app."
          echo ""
          echo "cbr_probe → con el endpoint/form hallado, fijar --search-url y ajustar"
          echo "  parseIndice en scraper/cbr-indice-cl.mjs (Fase 6)."
          echo ""
          echo "search/esri_describe/wfs → modos manuales; el log imprime el comando sugerido."
