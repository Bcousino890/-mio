name: Check TGR status (diagnóstico, no escribe nada)

# Mismo patrón de sentinel-push que scrape-tgr.yml: solo lee estado del VPS
# (proceso vivo, tail del log, conteo en BD) para diagnosticar sin relanzar
# ni tocar nada.
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'scraper/tgr/.check-status'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnóstico en el VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s << 'EOF'
            cd /opt/casafari
            echo "── Procesos run-tgr.sh / tgr_scraper.py ──"
            ps aux | grep -E "run-tgr.sh|tgr_scraper.py" | grep -v grep || echo "(ninguno corriendo)"

            echo ""
            echo "── Lockfile ──"
            if [ -e /tmp/casafari-scrape-tgr.lock ]; then
              echo "Existe, PID=$(cat /tmp/casafari-scrape-tgr.lock)"
              kill -0 "$(cat /tmp/casafari-scrape-tgr.lock)" 2>/dev/null && echo "  -> PID vivo" || echo "  -> PID muerto (lock huérfano)"
            else
              echo "No existe"
            fi

            echo ""
            echo "── Último log de lanzamiento (últimas 80 líneas) ──"
            LATEST_LOG=$(ls -t scraper/output/launch-tgr-*.log 2>/dev/null | head -1)
            echo "Archivo: ${LATEST_LOG:-ninguno}"
            if [ -n "$LATEST_LOG" ]; then
              tail -80 "$LATEST_LOG"
            fi

            echo ""
            echo "── Primeras líneas del log (init workers, primer error) ──"
            if [ -n "$LATEST_LOG" ]; then
              head -60 "$LATEST_LOG"
              echo "--- primer SessionNotCreatedException con contexto ---"
              grep -n -B5 "SessionNotCreatedException\|DevToolsActivePort\|user_data_dir\|Failed to read JSON" "$LATEST_LOG" | head -60
              echo ""
              echo "--- snippets de página en timeouts (diagnóstico bloqueo/captcha del sitio) ---"
              grep -n "snippet página" "$LATEST_LOG" | tail -20
            fi

            echo ""
            echo "── CSV de roles exportado ──"
            wc -l scraper/tgr/roles_input_rm.csv 2>/dev/null || echo "No existe roles_input_rm.csv"

            echo ""
            echo "── Conteo en Postgres ──"
            docker exec casafari-pg psql -U casafari -d casafari -At -c "SELECT count(*) FROM tgr_certificados;" 2>&1 || echo "No se pudo consultar Postgres"

            echo ""
            echo "── Permisos / usuario ──"
            whoami
            id
            ls -la scraper/tgr/
            ls -la scraper/tgr/data 2>&1 || echo "(no existe data/)"

            echo ""
            echo "── ¿chromedriver está confinado por snap/apparmor? ──"
            ls -la /usr/bin/chromedriver 2>&1
            dpkg -S /usr/bin/chromedriver 2>&1 || echo "(no es de un paquete deb)"
            apt list --installed 2>/dev/null | grep -i chromedriver || echo "(no instalado vía apt)"
            sudo aa-status 2>&1 | grep -i chrome || echo "(aa-status no disponible o sin perfiles chrome)"

            echo ""
            echo "── Diagnóstico Chrome/ChromeDriver ──"
            which google-chrome google-chrome-stable chromium chromium-browser 2>&1 || echo "(ningún binario de chrome en PATH)"
            CHROME_BIN=$(command -v chromium || command -v chromium-browser)
            CHROMEDRIVER_BIN=$(command -v chromedriver)
            echo "chromium: ${CHROME_BIN:-no encontrado}"
            echo "chromedriver: ${CHROMEDRIVER_BIN:-no encontrado}"
            if [ -n "$CHROMEDRIVER_BIN" ]; then
              ldd "$CHROMEDRIVER_BIN" 2>&1 | grep -i "not found" || echo "(sin libs faltantes según ldd)"
              "$CHROMEDRIVER_BIN" --version 2>&1 || echo "(falló al ejecutar --version)"
            fi
            if [ -n "$CHROME_BIN" ]; then
              echo "── Probando lanzar chromium directamente (headless, --no-sandbox) ──"
              timeout 15 "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom https://example.com 2>&1 | tail -40
              echo "exit code: $?"
            fi

            echo ""
            echo "── Diagnóstico Google Chrome stable (el que usa el scraper) ──"
            GCS_BIN="/usr/bin/google-chrome-stable"
            ls -la "$GCS_BIN" 2>&1 || echo "(no existe el archivo)"
            file "$GCS_BIN" 2>&1 || true
            if [ -L "$GCS_BIN" ]; then
              echo "Es symlink -> $(readlink -f "$GCS_BIN")"
              ls -la "$(readlink -f "$GCS_BIN")" 2>&1 || echo "(target del symlink no existe)"
            fi
            echo "── ldd del binario real ──"
            ldd "$(readlink -f "$GCS_BIN" 2>/dev/null || echo "$GCS_BIN")" 2>&1 | grep -i "not found" || echo "(sin libs faltantes según ldd)"
            echo "── google-chrome-stable --version ──"
            "$GCS_BIN" --version 2>&1 || echo "(falló al ejecutar --version, exit $?)"
            echo "── Probando lanzar google-chrome-stable directamente (headless, --no-sandbox) ──"
            timeout 15 "$GCS_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/diag-gcs-profile --dump-dom https://example.com 2>&1 | tail -40
            echo "exit code: $?"

            echo ""
            echo "── Binario real (no wrapper) ──"
            REAL_BIN="$(dirname "$(readlink -f "$GCS_BIN")")/chrome"
            ls -la "$REAL_BIN" 2>&1 || echo "(no existe el binario real esperado)"
            file "$REAL_BIN" 2>&1 || true
            echo "── Directorio completo de instalación ──"
            ls -la "$(dirname "$REAL_BIN")" 2>&1
            echo "── strace del intento de stat/exec por chromedriver (si está disponible) ──"
            which strace 2>&1 || echo "(strace no disponible)"

            echo ""
            echo "── Memoria / recursos del sistema ──"
            free -h
            nproc
            ulimit -a 2>&1 | grep -i "open files\|max user processes"

            echo ""
            echo "── Reproduciendo la sesión de Selenium directamente vía API HTTP de chromedriver ──"
            CHROMEDRIVER_BIN_2="/usr/bin/chromedriver"
            "$CHROMEDRIVER_BIN_2" --version
            "$CHROMEDRIVER_BIN_2" --port=9515 --verbose > /tmp/chromedriver-diag.log 2>&1 &
            CD_PID=$!
            sleep 2
            curl -s -X POST http://127.0.0.1:9515/session -H "Content-Type: application/json" -d "{
              \"capabilities\": {
                \"alwaysMatch\": {
                  \"browserName\": \"chrome\",
                  \"goog:chromeOptions\": {
                    \"binary\": \"$REAL_BIN\",
                    \"args\": [\"--headless=new\", \"--no-sandbox\", \"--disable-gpu\", \"--disable-dev-shm-usage\", \"--window-size=1920,1080\", \"--disable-blink-features=AutomationControlled\", \"--user-data-dir=/tmp/diag-cdsession-profile\", \"--remote-debugging-port=0\"],
                    \"excludeSwitches\": [\"enable-automation\"]
                  }
                }
              }
            }" 2>&1
            echo ""
            echo "── Log verbose de chromedriver (últimas 60 líneas) ──"
            sleep 1
            tail -60 /tmp/chromedriver-diag.log 2>&1
            kill "$CD_PID" 2>/dev/null || true
          EOF
