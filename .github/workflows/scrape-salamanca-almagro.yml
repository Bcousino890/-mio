name: Scrape Salamanca + Almagro (escribe en BD de producción)

# A diferencia de scrape-goya.yml (que corre en el runner y solo commitea
# JSON), esta automatización SSH al VPS y lanza el scrape ahí, porque solo el
# VPS tiene acceso a DATABASE_URL de producción. El job del runner solo lanza
# el proceso en background (nohup) y termina; el scrape real (varias horas)
# sigue corriendo en el VPS de forma independiente.
on:
  workflow_dispatch: {}  # botón "Run workflow" manual (o trigger por API)
  push:
    branches:
      - main
    paths:
      # La API de GitHub no permite disparar workflow_dispatch en este entorno
      # (token sin ese scope). Este archivo centinela existe solo para poder
      # lanzar el scrape hace un push (commitear un cambio aquí). El script
      # de destino ya tiene su propio lockfile, así que un push accidental
      # mientras hay un scrape en curso simplemente no hace nada (aborta).
      - 'scraper/.launch-salamanca-almagro'

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Matar scrape anterior (si existe) y configurar proxy
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s << 'EOF'
            cd /opt/casafari

            # Matar cualquier scrape anterior sin piedad
            echo "⚠ Matando cualquier scrape anterior..."
            pkill -9 -f "scrape-salamanca-almagro.sh" || true
            pkill -9 -f "scrape-zone.mjs" || true
            rm -f /tmp/casafari-scrape-salamanca-almagro.lock
            sleep 2

            # Crear .env.scraper con configuración de Smartproxy. Usamos echo
            # línea por línea (en vez de un heredoc anidado) porque un heredoc
            # con el cuerpo sin indentar rompe el "block scalar" de YAML (la
            # indentación dejaba de coincidir con la del run: | de este step)
            # y eso hacía que GitHub rechazara el workflow entero con un error
            # de parseo, sin ejecutar ningún job (así estuvo ~2h sin lanzar nada).
            > .env.scraper
            echo "PROXY_PROVIDER=smartproxy" >> .env.scraper
            echo "SMARTPROXY_PROXY_HOST=proxy.smartproxy.net" >> .env.scraper
            echo "SMARTPROXY_PROXY_PORT=3120" >> .env.scraper
            echo "SMARTPROXY_PROXY_USER=" >> .env.scraper
            echo "SMARTPROXY_PROXY_PASS=9cf8f476185ea51d90a811dfedf19974" >> .env.scraper
            echo "PROXY_COUNTRY=ES" >> .env.scraper
            chmod 600 .env.scraper
            echo "✅ .env.scraper creado (proxy Smartproxy configurado)"
          EOF

      - name: Lanzar scrape en background en el VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s << 'EOF'
            set -e
            cd /opt/casafari
            mkdir -p scraper/output
            chmod +x scraper/scrape-salamanca-almagro.sh
            nohup bash scraper/scrape-salamanca-almagro.sh \
              > "scraper/output/launch-$(date +%Y%m%d_%H%M%S).log" 2>&1 < /dev/null &
            PID=$!
            disown
            sleep 3
            if kill -0 "$PID" 2>/dev/null; then
              echo "▶ Scrape lanzado en background en el VPS (PID $PID)"
            else
              echo "✗ El proceso no arrancó, revisa scraper/output/ en el VPS"
              exit 1
            fi
          EOF

      - name: Resumen
        run: |
          echo "El scrape de Salamanca (6 sub-barrios) + Almagro quedó corriendo en background en el VPS."
          echo "Puede tardar varias horas. Progreso y logs en /opt/casafari/scraper/output/ del VPS."
          echo "Resultados visibles en https://crm.cremme.es/anuncios a medida que se van insertando."
