name: Deploy a CX33

# Despliega casafari-mio al VPS sin que el servidor necesite credenciales de git.
# El runner de GitHub (que SÍ tiene acceso al repo privado) hace checkout y
# sincroniza el código al VPS por SSH; luego ejecuta el build allí.
on:
  push:
    branches:
      - main
      - claude/tender-hypatia-av518f
    paths:
      - 'web/**'
      - 'db/**'
      - 'infra/**'
      - 'scraper/**'
      - '.github/workflows/deploy.yml'
      # Archivos centinela (solo disparan otros workflows vía push, no son
      # cambios de código real): no deben forzar un rebuild+redeploy de la app.
      - '!scraper/.check-status'
      - '!scraper/.launch-salamanca-almagro'
      - '!scraper/.fix-db-password'
      - '!scraper/.add-casafari-ssh-key'
      - '!scraper/sii-scraper/.launch-sii-mapasui'
      - '!scraper/sii-scraper/.check-sii-status'
  workflow_dispatch: {}   # botón "Run workflow" manual

concurrency:
  group: deploy-cx33
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. El runner descarga el código (repo privado → acceso automático)
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Preparar la clave SSH para llegar al VPS
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # 2.5. Crear directorio en el VPS si no existe
      - name: Preparar directorio del VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" mkdir -p /opt/casafari

      # 3. Sincronizar el código al VPS (sin .git, sin node_modules, sin .env)
      - name: Rsync al VPS
        run: |
          rsync -avz --delete --stats \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env' \
            --exclude 'scraper/output' \
            --exclude 'scraper/tgr/venv' \
            --exclude 'scraper/tgr/data' \
            --exclude 'scraper/tgr/roles_input_rm.csv' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT || 22 }} -o ConnectTimeout=10 -o StrictHostKeyChecking=no" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/casafari/" || exit 1

      # 3.5. Construir la imagen en el RUNNER (7GB de RAM libres, sin Postgres,
      # Nominatim ni scrapes compitiendo) y cargarla ya construida en el VPS.
      # Construirla en el VPS de 8GB compartido muere con OOM (exit 137): 4
      # intentos seguidos entre los runs #361 (x3) y #362, incluso con 4GB de
      # swap garantizado por deploy.sh. deploy.sh recibe SKIP_BUILD=1 y usa la
      # imagen precargada.
      - name: Build de la imagen en el runner
        run: docker build -t casafari-app:latest ./web

      - name: Enviar imagen al VPS (docker save → docker load)
        run: |
          docker save casafari-app:latest | gzip | \
            ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
              -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              'gunzip | docker load && docker image prune -f >/dev/null'

      # 4. Ejecutar el deploy en el VPS
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s << 'EOF'
            set -e
            cd /opt/casafari

            # scraper/output no está en git (se genera en runtime); el rsync
            # --delete del paso anterior ya lo excluye, pero si por lo que
            # sea no existe (primer deploy, o quedó borrado de una corrida
            # vieja antes del exclude) hay que recrearlo o un scrape en
            # curso muere con ENOENT al escribir su fail-log.
            mkdir -p scraper/output

            # .env: si no existe lo crea desde la plantilla; si existe pero le
            # falta POSTGRES_PASSWORD (p.ej. de un intento previo fallido), lo completa.
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "📄 .env creado desde .env.example"
            fi
            if ! grep -q '^POSTGRES_PASSWORD=..*' .env; then
              if grep -q '^POSTGRES_PASSWORD=' .env; then
                sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
              else
                echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> .env
              fi
              echo "🔑 POSTGRES_PASSWORD generado aleatoriamente"
            fi

            # SmartProxy Chile (SMARTPROXY_CL_*): si están definidos como secrets
            # del repo, se sincronizan al .env del VPS en cada deploy (si no, no
            # se toca nada — sigue funcionando como antes). Así rotar el secret
            # en GitHub alcanza, sin entrar por SSH a editar el .env a mano.
            upsert_env() {
              local key="$1" val="$2"
              [ -z "$val" ] && return
              grep -v "^${key}=" .env > .env.tmp || true
              mv .env.tmp .env
              echo "${key}=${val}" >> .env
            }
            upsert_env "SMARTPROXY_CL_HOST" "${{ secrets.SMARTPROXY_CL_HOST }}"
            upsert_env "SMARTPROXY_CL_PORT" "${{ secrets.SMARTPROXY_CL_PORT }}"
            upsert_env "SMARTPROXY_CL_USER" "${{ secrets.SMARTPROXY_CL_USER }}"
            upsert_env "SMARTPROXY_CL_PASS" "${{ secrets.SMARTPROXY_CL_PASS }}"
            upsert_env "DEALERNET_USER" "${{ secrets.DEALERNET_USER }}"
            upsert_env "DEALERNET_PASSWORD" "${{ secrets.DEALERNET_PASSWORD }}"

            # Primera vez: bootstrap completo (DB+nginx+TLS). Después: deploy normal.
            if docker ps --format '{{.Names}}' | grep -q casafari-app; then
              echo "▶ Deploy incremental (app ya existe)"
              SKIP_BUILD=1 bash infra/deploy.sh
            else
              echo "▶ Primera instalación: bootstrap completo"
              SKIP_BUILD=1 bash infra/bootstrap.sh
            fi
          EOF
