name: Deploy a CX33

# Despliega casafari-mio al VPS sin que el servidor necesite credenciales de git.
# El runner de GitHub (que SÍ tiene acceso al repo privado) hace checkout y
# sincroniza el código al VPS por SSH; luego ejecuta el build allí.
on:
  push:
    branches:
      - main
      - claude/tender-hypatia-av518f
      - claude/wizardly-galileo-s7z7fa
    paths:
      - 'web/**'
      - 'web-cousino/**'
      - 'db/**'
      - 'infra/**'
      - 'scraper/**'
      - '.github/workflows/deploy.yml'
      # Archivos centinela (solo disparan otros workflows vía push, no son
      # cambios de código real): no deben forzar un rebuild+redeploy de la app.
      - '!scraper/.check-status'
      - '!scraper/.launch-salamanca-almagro'
      - '!scraper/.fix-db-password'
      - '!scraper/.add-casafari-ssh-key'
  workflow_dispatch: {}   # botón "Run workflow" manual

concurrency:
  group: deploy-cx33
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. El runner descarga el código (repo privado → acceso automático)
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Preparar la clave SSH para llegar al VPS
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # 3. Sincronizar el código al VPS (sin .git, sin node_modules, sin .env)
      - name: Rsync al VPS
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env' \
            --exclude 'scraper/output' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT || 22 }}" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/casafari/"

      # 4. Ejecutar el deploy en el VPS
      #
      # Importante: NO se usa `bash -s << EOF` (heredoc por stdin). Si algún
      # comando dentro del script remoto hereda stdin (p.ej. `docker compose
      # exec`, incluso con `-T`, en un bucle como el de post-deploy.sh), puede
      # robarle bytes al pipe SSH antes de que el propio `bash -s` los lea,
      # descartando en silencio el resto del script sin ningún error — así
      # se perdía el bloque de deploy de web-cousino tras el deploy del CRM.
      # Al ejecutar un archivo real por ruta (sincronizado por rsync), bash
      # lo lee con su propio open(), no comparte el pipe de stdin con sus
      # hijos. `-n` además redirige stdin del cliente ssh desde /dev/null.
      - name: Deploy
        run: |
          ssh -n -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "bash /opt/casafari/infra/remote-deploy.sh"
