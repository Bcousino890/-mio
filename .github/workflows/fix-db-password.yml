name: Fix DB password mismatch (VPS)

# El scrape de Salamanca+Almagro falla en todas las zonas con
# routine: 'auth_failed' al conectar a Postgres en 127.0.0.1:5433: el
# POSTGRES_PASSWORD que tiene .env hoy no es el mismo que el rol "casafari"
# usa de verdad en la BD (Postgres solo aplica esa env var al crear el
# volumen por primera vez; deploy.yml puede regenerar .env más adelante sin
# que eso cambie el password ya guardado en el volumen — así se desincronizan).
#
# Esto rota el password a un valor nuevo conocido y lo sincroniza en los 3
# sitios que deben coincidir: el rol de Postgres, .env, y el contenedor
# casafari-app (que lo necesita para su propio DATABASE_URL). El valor nunca
# se imprime en el log.
#
# Como con los otros workflows de este repo, se dispara con push a un
# archivo centinela porque la API de GitHub no permite lanzar
# workflow_dispatch en este entorno.
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'scraper/.fix-db-password'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rotar y resincronizar POSTGRES_PASSWORD en el VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s << 'EOF'
            set -e
            cd /opt/casafari

            NEWPASS="$(openssl rand -hex 24)"

            echo "▶ Aplicando la nueva contraseña al rol 'casafari' en Postgres..."
            # NEWPASS es hex puro (openssl rand -hex): seguro interpolarlo
            # directo en el SQL, sin comillas ni caracteres especiales que
            # rompan el literal. (La sintaxis :'var' de psql para variables
            # no se aplica dentro de -c, así que no sirve aquí.)
            docker exec casafari-pg psql -U casafari -d casafari \
              -c "ALTER USER casafari WITH PASSWORD '$NEWPASS';" >/dev/null
            echo "✅ Rol 'casafari' actualizado en Postgres"

            echo "▶ Actualizando POSTGRES_PASSWORD en .env..."
            if grep -q '^POSTGRES_PASSWORD=' .env; then
              sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${NEWPASS}|" .env
            else
              echo "POSTGRES_PASSWORD=${NEWPASS}" >> .env
            fi
            echo "✅ .env actualizado"

            echo "▶ Recreando casafari-app con la contraseña sincronizada..."
            (cd infra && docker compose -p casafari --env-file ../.env up -d --force-recreate app)
            echo "✅ casafari-app recreado"

            echo ""
            echo "── Verificación: contenedores ──"
            docker ps --filter "name=casafari" --format "table {{.Names}}\t{{.Status}}"

            echo ""
            echo "── Verificación: conexión host->5433 con la contraseña nueva ──"
            sleep 3
            PGPASSWORD="$NEWPASS" psql -h 127.0.0.1 -p 5433 -U casafari -d casafari -t \
              -c "select 'conexión OK con la nueva contraseña';" 2>&1

            echo ""
            echo "── Verificación: salud de casafari-app ──"
            sleep 3
            curl -sS -m 10 -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:3000 2>&1 || echo "(no respondió todavía)"
          EOF

      - name: Resumen
        run: |
          echo "Contraseña de Postgres rotada y sincronizada entre el rol 'casafari', .env y casafari-app."
          echo "El scraper ya puede conectar a 127.0.0.1:5433 con la POSTGRES_PASSWORD actual de .env."
