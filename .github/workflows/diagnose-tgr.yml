name: Diagnosticar TGR (solo lectura, sin matar/relanzar)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'scraper/tgr/.diagnose-tgr'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspeccionar estado real del VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s << 'EOF'
            echo "=== Lockfile ==="
            ls -la /tmp/casafari-scrape-tgr.lock 2>&1 || echo "(no existe)"
            cat /tmp/casafari-scrape-tgr.lock 2>/dev/null || true

            echo "=== Procesos run-tgr.sh / tgr_scraper.py / chrome / chromedriver ==="
            ps aux | grep -E "run-tgr|tgr_scraper|chrome" | grep -v grep || echo "(ninguno corriendo)"

            echo "=== Último log de lanzamiento (launch-tgr-*.log) ==="
            cd /opt/casafari/scraper/output 2>/dev/null && ls -t launch-tgr-*.log 2>/dev/null | head -1 | xargs -r tail -n 80

            echo "=== Último debug log (tgr-debug-*.log) ==="
            ls -t tgr-debug-*.log 2>/dev/null | head -1 | xargs -r tail -n 80

            echo "=== /tmp/tgr-restart.log (si existe, del último reinstall) ==="
            tail -n 80 /tmp/tgr-restart.log 2>/dev/null || echo "(no existe)"
          EOF
