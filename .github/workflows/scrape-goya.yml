name: Scrape Goya Complete (Rent + Sale)

on:
  workflow_dispatch:  # Manual trigger desde GitHub UI
  schedule:
    - cron: '0 2 * * 0'  # Cada domingo a las 2 AM UTC (3 AM Madrid)

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 horas max

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd scraper && npm install

      - name: Create output directory
        run: mkdir -p scraper/output

      - name: Scrape Goya Alquiler (596)
        env:
          PROXY_PROVIDER: smartproxy
          SMARTPROXY_PROXY_HOST: eu.smartproxy.net
          SMARTPROXY_PROXY_PORT: 3120
          SMARTPROXY_PROXY_USER: smart-b04nrjtamr8a_area-ES_city-MADRID
          SMARTPROXY_PROXY_PASS: ZLOutsGkCC5kgmwS
        run: |
          node scraper/scrape-zone.mjs \
            --zone madrid/barrio-de-salamanca/goya \
            --op rent \
            --max-pages 60 \
            --emit-app scraper/output/goya-rent-latest.json

          echo "Rent listings:"
          node -e "console.log(JSON.parse(require('fs').readFileSync('scraper/output/goya-rent-latest.json')).length + ' anuncios')"

      - name: Reintentar fallidas - Alquiler
        env:
          PROXY_PROVIDER: smartproxy
          SMARTPROXY_PROXY_HOST: eu.smartproxy.net
          SMARTPROXY_PROXY_PORT: 3120
          SMARTPROXY_PROXY_USER: smart-b04nrjtamr8a_area-ES_city-MADRID
          SMARTPROXY_PROXY_PASS: ZLOutsGkCC5kgmwS
        run: |
          FAIL_LOG="scraper/output/goya-rent-latest.json.failed.json"
          if [ -s "$FAIL_LOG" ] && [ "$(node -e "console.log(JSON.parse(require('fs').readFileSync('$FAIL_LOG')).length)")" -gt 0 ]; then
            echo "Reintentando fichas de alquiler fallidas..."
            node scraper/scrape-zone.mjs \
              --zone madrid/barrio-de-salamanca/goya \
              --op rent \
              --retry-failed "$FAIL_LOG" \
              --emit-app scraper/output/goya-rent-retry.json

            node << 'EOF'
            const fs = require('fs');
            const main = JSON.parse(fs.readFileSync('scraper/output/goya-rent-latest.json'));
            const retry = JSON.parse(fs.readFileSync('scraper/output/goya-rent-retry.json'));
            const seen = new Set(main.map(l => l.external_id));
            const recovered = retry.filter(l => !seen.has(l.external_id));
            const merged = [...main, ...recovered];
            fs.writeFileSync('scraper/output/goya-rent-latest.json', JSON.stringify(merged, null, 2));
            console.log(`  Recuperadas ${recovered.length}/${retry.length} fichas de alquiler. Total: ${merged.length}`);
            EOF
          else
            echo "Sin fichas fallidas en alquiler."
          fi

      - name: Scrape Goya Venta (691)
        env:
          PROXY_PROVIDER: smartproxy
          SMARTPROXY_PROXY_HOST: eu.smartproxy.net
          SMARTPROXY_PROXY_PORT: 3120
          SMARTPROXY_PROXY_USER: smart-b04nrjtamr8a_area-ES_city-MADRID
          SMARTPROXY_PROXY_PASS: ZLOutsGkCC5kgmwS
        run: |
          node scraper/scrape-zone.mjs \
            --zone madrid/barrio-de-salamanca/goya \
            --op sale \
            --max-pages 60 \
            --emit-app scraper/output/goya-sale-latest.json

          echo "Sale listings:"
          node -e "console.log(JSON.parse(require('fs').readFileSync('scraper/output/goya-sale-latest.json')).length + ' anuncios')"

      - name: Reintentar fallidas - Venta
        env:
          PROXY_PROVIDER: smartproxy
          SMARTPROXY_PROXY_HOST: eu.smartproxy.net
          SMARTPROXY_PROXY_PORT: 3120
          SMARTPROXY_PROXY_USER: smart-b04nrjtamr8a_area-ES_city-MADRID
          SMARTPROXY_PROXY_PASS: ZLOutsGkCC5kgmwS
        run: |
          FAIL_LOG="scraper/output/goya-sale-latest.json.failed.json"
          if [ -s "$FAIL_LOG" ] && [ "$(node -e "console.log(JSON.parse(require('fs').readFileSync('$FAIL_LOG')).length)")" -gt 0 ]; then
            echo "Reintentando fichas de venta fallidas..."
            node scraper/scrape-zone.mjs \
              --zone madrid/barrio-de-salamanca/goya \
              --op sale \
              --retry-failed "$FAIL_LOG" \
              --emit-app scraper/output/goya-sale-retry.json

            node << 'EOF'
            const fs = require('fs');
            const main = JSON.parse(fs.readFileSync('scraper/output/goya-sale-latest.json'));
            const retry = JSON.parse(fs.readFileSync('scraper/output/goya-sale-retry.json'));
            const seen = new Set(main.map(l => l.external_id));
            const recovered = retry.filter(l => !seen.has(l.external_id));
            const merged = [...main, ...recovered];
            fs.writeFileSync('scraper/output/goya-sale-latest.json', JSON.stringify(merged, null, 2));
            console.log(`  Recuperadas ${recovered.length}/${retry.length} fichas de venta. Total: ${merged.length}`);
            EOF
          else
            echo "Sin fichas fallidas en venta."
          fi

      - name: Consolidate datasets
        run: |
          node << 'EOF'
          const fs = require('fs');
          const rent = JSON.parse(fs.readFileSync('scraper/output/goya-rent-latest.json'));
          const sale = JSON.parse(fs.readFileSync('scraper/output/goya-sale-latest.json'));
          const combined = [...rent, ...sale];

          // Deduplicación por external_id (ID único de Idealista)
          const seen = new Set();
          const deduped = combined.filter(l => {
            if (seen.has(l.external_id)) return false;
            seen.add(l.external_id);
            return true;
          });

          const duplicatesRemoved = combined.length - deduped.length;

          console.log(`✅ CONSOLIDACIÓN Y DEDUPLICACIÓN:`);
          console.log(`  Alquiler: ${rent.length} anuncios`);
          console.log(`  Venta: ${sale.length} anuncios`);
          console.log(`  Total antes dedup: ${combined.length}`);
          console.log(`  Duplicados eliminados: ${duplicatesRemoved}`);
          console.log(`  TOTAL FINAL: ${deduped.length} anuncios únicos`);

          fs.writeFileSync('web/lib/listings-goya-full.json', JSON.stringify(deduped, null, 2));
          console.log(`  ✓ Guardado en web/lib/listings-goya-full.json`);
          EOF

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add web/lib/listings-goya-full.json scraper/output/
          git diff --cached --quiet && exit 0
          git commit -m "🤖 Auto: Update Goya dataset ($(node -e "console.log(JSON.parse(require('fs').readFileSync('web/lib/listings-goya-full.json')).length)") listings)"
          git fetch origin main
          git rebase origin/main
          for i in 1 2 3 4; do
            git push origin main && break
            echo "Push falló, reintentando ($i/4)..."
            sleep $((i * 5))
            git fetch origin main
            git rebase origin/main
          done

      - name: Summary
        run: |
          TOTAL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('web/lib/listings-goya-full.json')).length)")
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║ ✅ SCRAPING GOYA COMPLETADO                                   ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📊 ESTADÍSTICAS FINALES:"
          echo "  • Total anuncios: $TOTAL"
          echo "  • Archivo: web/lib/listings-goya-full.json"
          echo "  • Status: ✓ Listo para usar en la web"
          echo ""
