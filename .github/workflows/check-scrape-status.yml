name: Check scrape status (lee progreso en el VPS)

# Permite verificar si el scrape de Salamanca+Almagro sigue corriendo y cuánto
# avanzó, sin necesitar acceso SSH manual. Igual que scrape-salamanca-almagro.yml,
# se dispara con push a un archivo centinela porque la API de GitHub no permite
# lanzar workflow_dispatch en este entorno. Es de solo lectura: no toca el
# scrape en curso, solo imprime su estado en el log del job.
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - claude/tender-hypatia-av518f
    paths:
      - 'scraper/.check-status'

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Probar la URL pública real (desde internet, no desde el VPS)
        run: |
          echo "── GET https://crm.cremme.es/api/listings?limit=2 ──"
          curl -sS -i -m 20 "https://crm.cremme.es/api/listings?limit=2" | head -c 2000
          echo ""
          echo ""
          echo "── GET https://crm.cremme.es/anuncios (headers + primeros bytes del HTML) ──"
          curl -sS -D - -m 20 "https://crm.cremme.es/anuncios" -o /tmp/anuncios.html
          echo "--- body (primeros 1500 chars) ---"
          head -c 1500 /tmp/anuncios.html
          echo ""
          echo "--- ¿aparece 'mockListings' o una URL de foto de Idealista (Goya hardcodeado) en el HTML? ---"
          grep -o "mockListings" /tmp/anuncios.html || echo "(no aparece 'mockListings' en el HTML)"
          grep -o "img[0-9]*\.idealista\.com[^\"]*" /tmp/anuncios.html | head -3 || echo "(no aparece ninguna URL de img*.idealista.com en el HTML)"
          echo "--- ¿aparece el texto 'Cargando anuncios' (shell vacío correcto, sin datos hardcodeados)? ---"
          grep -o "Cargando anuncios" /tmp/anuncios.html || echo "(no aparece 'Cargando anuncios' en el HTML)"

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Leer estado del scrape en el VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s << 'EOF'
            set -e
            cd /opt/casafari

            echo "── Lockfile ──────────────────────────────────────────"
            LOCKFILE="/tmp/casafari-scrape-salamanca-almagro.lock"
            LOCK_PID="$(cat "$LOCKFILE" 2>/dev/null || true)"
            if [ -e "$LOCKFILE" ] && kill -0 "$LOCK_PID" 2>/dev/null; then
              echo "▶ Scrape EN CURSO (PID $LOCK_PID)"
              echo "  proceso real con ese PID:"
              ps -fp "$LOCK_PID" 2>&1 || echo "  (ps no encontró el PID, puede ser un PID reciclado)"
            else
              echo "○ No hay scrape corriendo en este momento"
            fi

            echo ""
            echo "── Procesos node/scrape vivos ────────────────────────"
            ps aux | grep -E 'node|scrape-zone|scrape-salamanca' | grep -v grep || echo "(ninguno)"

            echo ""
            echo "── stdout en vivo del proceso scrape-zone.mjs (vía /proc, aunque el archivo ya no exista) ─"
            ZONE_PID="$(pgrep -f 'node scraper/scrape-zone.mjs' | head -1)"
            if [ -n "$ZONE_PID" ]; then
              echo "(PID $ZONE_PID)"
              tail -c 4000 "/proc/$ZONE_PID/fd/1" 2>&1 || echo "  (no se pudo leer /proc/$ZONE_PID/fd/1)"
            else
              echo "(no hay proceso scrape-zone.mjs corriendo)"
            fi

            echo ""
            echo "── Proxy configurado (sin mostrar credenciales) ──────"
            if [ -f .env.scraper ]; then
              while IFS='=' read -r key val; do
                if [ -n "$val" ]; then echo "  $key=<set>"; else echo "  $key=<vacío>"; fi
              done < <(grep -E '^(PROXY_PROVIDER|GEONODE_PROXY_HOST|SMARTPROXY_PROXY_HOST)=' .env.scraper)
            else
              echo "  (no existe .env.scraper)"
            fi

            echo ""
            echo "── Diagnóstico: respuesta cruda de la API de Smartproxy (Extracción API) ─"
            curl -sS -m 10 "https://www.smartproxy.org/web_v1/ip/get-ip-v3?app_key=9cf8f476185ea51d90a811dfedf19974&pt=9&num=3&ep=&cc=ES&state=&city=&life=30&lb=%5Cn&format=json&protocol=1" 2>&1 | head -c 2000 || echo "(no se pudo consultar la API de Smartproxy desde el VPS)"
            echo ""
            echo "IP pública saliente del VPS (para añadir a la whitelist de Smartproxy):"
            echo "  IPv4: $(curl -sS -4 -m 10 https://ifconfig.me 2>&1 || echo '(no disponible)')"
            echo "  IPv6: $(curl -sS -6 -m 10 https://ifconfig.me 2>&1 || echo '(no disponible)')"
            echo ""

            echo ""
            echo "── Diagnóstico: ¿el scrape pudo autenticarse en Postgres (host:5433)? ─"
            if [ -f .env ]; then set -a; source .env; set +a; fi
            if [ -z "${POSTGRES_PASSWORD:-}" ]; then
              echo "  ✗ POSTGRES_PASSWORD no está definido en .env"
            else
              command -v psql >/dev/null 2>&1 || sudo apt-get install -y postgresql-client >/dev/null 2>&1
              PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -p 5433 -U casafari -d casafari -t -c "select 'conexión OK desde el host (5433)';" 2>&1 || echo "  ✗ Falló la conexión host->5433 con la POSTGRES_PASSWORD de .env"
            fi
            echo "  Contraseña real que usa el contenedor casafari-pg (env var con la que arrancó):"
            docker exec casafari-pg printenv POSTGRES_PASSWORD 2>&1 | sed 's/./*/g'
            echo "  ¿Coincide con la de .env? (longitudes, sin revelar valores):"
            echo "  longitud .env:        ${#POSTGRES_PASSWORD}"
            echo "  longitud contenedor:  $(docker exec casafari-pg printenv POSTGRES_PASSWORD 2>/dev/null | wc -c)"

            echo ""
            echo "── Total acumulado en BD por zona/operación (hoy) ────"
            if [ -f .env ]; then set -a; source .env; set +a; fi
            docker exec casafari-pg psql -U casafari -d casafari -t -c "
              SELECT zone_raw, operation, count(*) AS n, max(last_seen_at) AS ultimo
              FROM listings
              WHERE last_seen_at::date = current_date
              GROUP BY zone_raw, operation
              ORDER BY ultimo DESC;
            " 2>&1 || echo "(no se pudo consultar la BD)"

            echo ""
            echo "── Diagnóstico: reloj de Postgres vs filtro 'hoy' ────"
            docker exec casafari-pg psql -U casafari -d casafari -t -c "SELECT now() AS ahora, current_date AS hoy_segun_pg, current_setting('TimeZone') AS tz;" 2>&1 || true

            echo ""
            echo "── Total acumulado en BD por zona/operación (TODO, sin filtro de fecha) ─"
            docker exec casafari-pg psql -U casafari -d casafari -t -c "
              SELECT zone_raw, operation, count(*) AS n, max(last_seen_at) AS ultimo, min(last_seen_at) AS primero
              FROM listings
              WHERE zone_raw LIKE 'madrid/barrio-de-salamanca%' OR zone_raw LIKE 'madrid/chamberi/almagro%'
              GROUP BY zone_raw, operation
              ORDER BY ultimo DESC;
            " 2>&1 || echo "(no se pudo consultar la BD)"

            echo ""
            echo "── Archivos en scraper/output/ (más recientes primero) ─"
            ls -lat scraper/output/ 2>&1 | head -20

            echo ""
            echo "── Log de lanzamiento más ANTIGUO completo ───────────"
            OLDEST_LAUNCH=$(ls -tr scraper/output/launch-*.log 2>/dev/null | head -1)
            if [ -n "$OLDEST_LAUNCH" ]; then
              echo "(${OLDEST_LAUNCH})"
              cat "$OLDEST_LAUNCH"
            else
              echo "(no hay logs de lanzamiento)"
            fi

            echo ""
            echo "── Último summary log ────────────────────────────────"
            LATEST_SUMMARY=$(ls -t scraper/output/salamanca-almagro-*.summary.log 2>/dev/null | head -1)
            if [ -n "$LATEST_SUMMARY" ]; then
              echo "(${LATEST_SUMMARY})"
              tail -40 "$LATEST_SUMMARY"
            else
              echo "(sin summary log todavía)"
            fi

            echo ""
            echo "── Listings actualizados en BD (última hora) ─────────"
            if [ -f .env ]; then set -a; source .env; set +a; fi
            docker exec casafari-pg psql -U casafari -d casafari -t -c "
              SELECT zone_raw, operation, count(*) AS n, max(last_seen_at) AS ultimo
              FROM listings
              WHERE last_seen_at > now() - interval '1 hour'
              GROUP BY zone_raw, operation
              ORDER BY ultimo DESC;
            " 2>&1 || echo "(no se pudo consultar la BD)"

            echo ""
            echo "── Diagnóstico: ¿el deploy en curso está colgado? ────"
            echo "Procesos npm/next/docker build vivos:"
            ps aux | grep -E 'npm|next|docker.*build|docker-buildx' | grep -v grep || echo "(ninguno)"
            echo ""
            echo "Espacio en disco:"
            df -h / 2>&1
            echo ""
            echo "Memoria:"
            free -m 2>&1
            echo ""
            echo "Todos los contenedores (incluye los detenidos):"
            docker ps -a --format "  {{.Names}}\t{{.Status}}\t{{.Image}}"
            echo ""
            echo "Últimas líneas del build de la imagen casafari-app (si hay buildkit en curso):"
            docker buildx du 2>&1 | head -5 || true

            echo ""
            echo "── Diagnóstico: ¿por qué no se ven los cambios en /anuncios? ─"
            echo "Estado de casafari-app:"
            docker ps --filter "name=casafari-app" --format "  {{.Names}}\t{{.Status}}"
            echo ""
            echo "DATABASE_URL que tiene el contenedor casafari-app (host y puerto, sin password):"
            docker exec casafari-app printenv DATABASE_URL 2>&1 | sed -E 's#(postgres(ql)?://[^:]+):[^@]+@#\1:***@#'
            echo ""
            echo "Respuesta de /api/listings vista DESDE el contenedor casafari-app (localhost:3000):"
            docker exec casafari-app wget -qO- "http://127.0.0.1:3000/api/listings?limit=2" 2>&1 | head -c 1500 || echo "  (falló el wget interno)"
            echo ""
            echo ""
            echo "Últimas líneas de logs de casafari-app (errores de conexión a BD, etc.):"
            docker logs casafari-app --tail 30 2>&1
          EOF
