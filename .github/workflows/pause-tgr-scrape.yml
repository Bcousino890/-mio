name: Pausar scrape TGR (Selenium) — no relanza nada

# Mata cualquier run-tgr.sh / tgr_scraper.py en curso en el VPS y limpia el
# lockfile, SIN relanzar el scrape (a diferencia de scrape-tgr.yml, que mata
# y vuelve a lanzar). Pensado para liberar el lockfile compartido
# (/tmp/casafari-scrape-tgr.lock) antes de correr la prueba acotada en
# --mode http, sin perder el progreso ya guardado en Postgres/SQLite.
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      # La API de GitHub no permite disparar workflow_dispatch en este entorno
      # (token sin ese scope), así que este centinela permite lanzarlo con un push.
      - 'scraper/tgr/.pause-tgr'

jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pausar scrape TGR en el VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s << 'EOF'
            cd /opt/casafari
            echo "── Estado antes de pausar ──"
            ps aux | grep -E "run-tgr.sh|tgr_scraper.py" | grep -v grep || echo "(ninguno corriendo)"
            echo ""
            echo "▶ Deteniendo run-tgr.sh / tgr_scraper.py (si hay alguno en curso)..."
            pkill -TERM -f "run-tgr.sh" || true
            pkill -TERM -f "tgr_scraper.py" || true
            sleep 3
            pkill -9 -f "run-tgr.sh" || true
            pkill -9 -f "tgr_scraper.py" || true
            rm -f /tmp/casafari-scrape-tgr.lock
            echo "▶ Lockfile liberado."
            echo ""
            echo "── Estado después de pausar ──"
            ps aux | grep -E "run-tgr.sh|tgr_scraper.py" | grep -v grep || echo "(ninguno corriendo, OK)"
          EOF

      - name: Resumen
        run: |
          echo "Scrape TGR (Selenium) pausado y lockfile liberado. El progreso ya guardado en Postgres/SQLite no se pierde."
          echo "Ahora se puede lanzar 'Scrape TGR — prueba acotada modo HTTP (experimental)' sin que el lockfile lo bloquee."
