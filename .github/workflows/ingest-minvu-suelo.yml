name: Ingesta valor de suelo MINVU (→ mercado_agregado_cl)

# Corre scraper/ingest-minvu-suelo.mjs EN EL VPS (salida a ide.minvu.cl + BD de
# producción), poblando mercado_agregado_cl (fuente='minvu_suelo'). Es la señal
# pública de "mercado realizado" que calibra el AVM v2.
#
# ide.minvu.cl es un portal Esri ArcGIS Hub (ver A0), así que la vía real es
# esri_url (FeatureServer/MapServer). wfs_url/layer quedan como fallback para
# otros portales que sí sean GeoServer clásico.
#
# Mismo patrón de DATABASE_URL que ingest-sii-mapasui-now.yml: source ../.env →
# POSTGRES_PASSWORD → postgres://casafari:...@127.0.0.1:5433/casafari.
#
# Primero corré "Verificar fuentes de mercado (A0)" → --search y --esri-describe
# para saber esri_url y field_valor/field_*. Lanzá con dry_run=true primero.
on:
  workflow_dispatch:
    inputs:
      esri_url:
        description: "URL del FeatureServer/MapServer (de A0 --search), vía real MINVU"
        required: false
        default: ""
      field_valor:
        description: "Campo con el valor UF/m² (de A0 --esri-describe)"
        required: true
      field_zona:
        description: "Campo con el id de zona (opcional)"
        required: false
        default: ""
      field_comuna:
        description: "Campo con el código de comuna (si la capa lo trae)"
        required: false
        default: ""
      comuna:
        description: "Código SII fijo (si la capa NO trae comuna). Ej. 15108"
        required: false
        default: ""
      periodo:
        description: "Período del indicador. Ej. 2024"
        required: true
        default: "2024"
      layer:
        description: "(solo fallback WFS, si esri_url está vacío) Capa GeoServer"
        required: false
        default: ""
      wfs_url:
        description: "(solo fallback WFS, si esri_url está vacío) URL base del WFS"
        required: false
        default: ""
      dry_run:
        description: "true = validar sin escribir en la BD"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ingesta MINVU en el VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s << EOF
            set -e
            cd /opt/casafari/scraper
            if [ -f ../.env ]; then set -a; source ../.env; set +a; fi
            if [ -z "\${POSTGRES_PASSWORD:-}" ]; then echo "✗ Falta POSTGRES_PASSWORD (.env)"; exit 1; fi
            export DATABASE_URL="postgres://casafari:\${POSTGRES_PASSWORD}@127.0.0.1:5433/casafari"
            if [ ! -d node_modules/pg ]; then
              echo "▶ Instalando pg..."; npm install --omit=dev --no-audit --no-fund
            fi
            ARGS=( --field-valor "${{ github.event.inputs.field_valor }}" \
                   --periodo "${{ github.event.inputs.periodo }}" )
            if [ -n "${{ github.event.inputs.esri_url }}" ]; then
              ARGS+=( --esri-url "${{ github.event.inputs.esri_url }}" )
            else
              ARGS+=( --wfs-url "${{ github.event.inputs.wfs_url }}" --layer "${{ github.event.inputs.layer }}" )
            fi
            [ -n "${{ github.event.inputs.field_zona }}" ]   && ARGS+=( --field-zona "${{ github.event.inputs.field_zona }}" )
            [ -n "${{ github.event.inputs.field_comuna }}" ] && ARGS+=( --field-comuna "${{ github.event.inputs.field_comuna }}" )
            [ -n "${{ github.event.inputs.comuna }}" ]       && ARGS+=( --comuna "${{ github.event.inputs.comuna }}" )
            [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS+=( --dry-run )
            echo "▶ node ingest-minvu-suelo.mjs \${ARGS[@]}"
            node ingest-minvu-suelo.mjs "\${ARGS[@]}"
          EOF

      - name: Resumen
        run: |
          echo "Ingesta MINVU terminada. Si fue dry-run, relanzá con dry_run=false para persistir."
          echo "Verificá: SELECT count(*) FROM mercado_agregado_cl WHERE fuente='minvu_suelo';"
