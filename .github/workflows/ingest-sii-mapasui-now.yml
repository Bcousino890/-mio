name: Watchdog + ingesta de predios SII mapasui

# El scrape de mapasui (run-sii-mapasui.sh) solo ingesta a
# sii_mapasui_predios_cl al terminar TODA la comuna (paso [3/3], al final del
# script). Si la corrida lleva muchas horas en la etapa de predios, ya hay
# miles de registros extraídos en scraper/sii-scraper/output/predios/*.jsonl
# en el VPS que no se ven en /chile/sii-mapasui hasta que termine todo.
#
# Este workflow ingesta ESE output ya existente ahora mismo, sin tocar el
# proceso del scrape en curso (ingest-sii-mapasui.mjs solo lee los .jsonl; el
# INSERT ... ON CONFLICT DO UPDATE de sii-mapasui-cl.mjs lo hace seguro de
# re-ejecutar mientras el scraper sigue escribiendo más líneas al mismo archivo).
on:
  workflow_dispatch: {}
  # Respaldo cada 30 min: la ingesta incremental de run-sii-mapasui.sh (cada 10
  # min) es el camino normal, pero este pipeline ya se murió en silencio dos
  # veces (rsync --delete, corrida lanzada con script viejo). Re-ingestar el
  # JSONL existente es idempotente y tarda ~30 s. Se pide cada 30 min (no cada
  # hora) porque GitHub Actions descarta/retrasa mucho los scheduled runs: aun
  # a esta cadencia se ven gaps reales de ~2-3 h, así que pedir más seguido es
  # la única forma de que sii_mapasui_predios_cl no quede horas por detrás del
  # disco (y de que el latido de sii-mapasui-stats no salte a "estancado").
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches:
      - main
    paths:
      - 'scraper/.ingest-sii-mapasui-now'

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ── Watchdog del scrape ──────────────────────────────────────────────
      # El scrape es un nohup suelto en el VPS: si muere (OOM, reboot, crash
      # tras 3 reintentos internos) nadie lo relanzaba y el pipeline requería
      # monitoreo humano. Este paso lo hace autónomo:
      #   - proceso vivo y con progreso           → no tocar
      #   - proceso vivo pero SIN progreso en 6 h → colgado: matar y relanzar
      #   - muerto y .sii-mapasui-complete existe → comuna completa, todo bien
      #   - muerto sin marcador                   → murió a medias: relanzar
      # El relanzamiento reutiliza los parámetros de la corrida original
      # (.sii-mapasui-params) y retoma desde los checkpoints, sin perder nada.
      - name: Watchdog — relanzar scrape si murió o se colgó
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s << 'EOF'
            set -e
            cd /opt/casafari
            LOCK=/tmp/casafari-scrape-sii-mapasui.lock
            OUT=scraper/sii-scraper/output

            necesita_relanzar=""
            PID=$(cat "$LOCK" 2>/dev/null || true)
            if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
              # Vivo. ¿Progresa? Checkpoints o JSONL tocados en las últimas 6 h.
              # (Los backoffs anti-429 duran minutos; 6 h sin escribir = colgado.)
              if [ -d "$OUT" ] && [ -n "$(find "$OUT/checkpoints" "$OUT/predios" -newermt '-6 hours' -print -quit 2>/dev/null)" ]; then
                echo "✓ Scrape vivo y con progreso (PID $PID) — nada que hacer."
              elif [ -n "$(find "$LOCK" -newermt '-6 hours' -print -quit 2>/dev/null)" ]; then
                # Corrida joven (<6 h): aún puede estar en venv/descubrimiento
                # sin haber escrito nada — no juzgarla todavía.
                echo "✓ Scrape vivo, corrida reciente (PID $PID) — esperando progreso."
              elif [ -f "$OUT/.sii-mapasui-complete" ]; then
                # Vivo sin escribir pero ya completó antes (p. ej. corrida de
                # verificación); no es un cuelgue.
                echo "✓ Scrape vivo, comuna ya completa — nada que hacer."
              else
                echo "⚠ Scrape vivo pero sin progreso en 6 h (PID $PID) — colgado. Matando..."
                pkill -9 -f "run-sii-mapasui.sh" || true
                pkill -9 -f "sii-scraper/run.py" || true
                rm -f "$LOCK"
                necesita_relanzar=1
              fi
            elif [ -f "$OUT/.sii-mapasui-complete" ]; then
              echo "✓ Scrape terminado ($(cat "$OUT/.sii-mapasui-complete")) — comuna completa, nada que relanzar."
              rm -f "$LOCK"
            else
              echo "⚠ Scrape muerto sin completar — relanzando..."
              rm -f "$LOCK"
              necesita_relanzar=1
            fi

            if [ -n "$necesita_relanzar" ]; then
              # Mismos parámetros que la corrida original si quedaron en disco.
              if [ -f "$OUT/.sii-mapasui-params" ]; then
                set -a; source "$OUT/.sii-mapasui-params"; set +a
                echo "  (params: comuna ${SII_COMUNA_NOMBRE:-?} ${SII_COMUNA_CODE:-?})"
              fi
              mkdir -p scraper/output
              chmod +x scraper/sii-scraper/run-sii-mapasui.sh
              nohup bash scraper/sii-scraper/run-sii-mapasui.sh \
                > "scraper/output/watchdog-relaunch-$(date +%Y%m%d_%H%M%S).log" 2>&1 < /dev/null &
              NEWPID=$!
              disown
              sleep 3
              if kill -0 "$NEWPID" 2>/dev/null; then
                echo "▶ Scrape relanzado por el watchdog (PID $NEWPID)."
              else
                echo "✗ El relanzamiento no arrancó — revisar scraper/output/ en el VPS."
                exit 1
              fi
            fi
          EOF

      - name: Ingestar output/predios/*.jsonl existente
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s << 'EOF'
            set -e
            cd /opt/casafari/scraper
            if [ ! -d sii-scraper/output/predios ]; then
              echo "○ No existe sii-scraper/output/predios en el VPS — nada que ingestar (salida limpia para el cron)."
              exit 0
            fi
            if [ -f ../.env ]; then set -a; source ../.env; set +a; fi
            if [ -z "${POSTGRES_PASSWORD:-}" ]; then
              echo "✗ Falta POSTGRES_PASSWORD (revisa .env)"
              exit 1
            fi
            export DATABASE_URL="postgres://casafari:${POSTGRES_PASSWORD}@127.0.0.1:5433/casafari"
            if [ ! -d node_modules/pg ]; then
              echo "▶ Instalando dependencias Node del scraper (pg)..."
              npm install --omit=dev --no-audit --no-fund
            fi
            echo "▶ Ingestando sii-scraper/output/predios/ en sii_mapasui_predios_cl..."
            node ingest-sii-mapasui.mjs --dir sii-scraper/output/predios
          EOF
