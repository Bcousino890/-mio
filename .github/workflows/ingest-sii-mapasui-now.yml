name: Watchdog + ingesta de predios SII mapasui

# El scrape de mapasui (run-sii-mapasui.sh) solo ingesta a
# sii_mapasui_predios_cl al terminar TODA la comuna (paso [3/3], al final del
# script). Si la corrida lleva muchas horas en la etapa de predios, ya hay
# miles de registros extraídos en scraper/sii-scraper/output/predios/*.jsonl
# en el VPS que no se ven en /chile/sii-mapasui hasta que termine todo.
#
# Este workflow ingesta ESE output ya existente ahora mismo, sin tocar el
# proceso del scrape en curso (ingest-sii-mapasui.mjs solo lee los .jsonl; el
# INSERT ... ON CONFLICT DO UPDATE de sii-mapasui-cl.mjs lo hace seguro de
# re-ejecutar mientras el scraper sigue escribiendo más líneas al mismo archivo,
# y solo consume líneas ya terminadas en \n, nunca una a medio escribir).
#
# ⚠ ESTE WORKFLOW YA NO TIENE `schedule:`. El watchdog + ingesta periódicos
# corren ahora en el CRON DEL VPS, cada 10 min:
#   scraper/sii-scraper/watchdog-ingest-sii-mapasui.sh
#   (lo instala infra/install-crons.sh en cada deploy)
#
# Por qué se movió: este job no hacía más que levantar un runner Ubuntu —
# facturado por minuto empezado, y el repo es privado — para abrir un SSH al
# VPS y lanzar un script que ya vivía en el VPS. 48 arranques de runner al día
# como mando a distancia. Encima GitHub descarta y retrasa los scheduled runs
# (huecos reales de 2-3 h pidiendo cada 30 min), mientras que el cron local no
# deriva: ahora corre cada 10 min, va más al día y no cuesta nada.
#
# Lo que queda acá es el DISPARO MANUAL — el botón de "ingestar ahora" y el
# push al centinela. Solo gastan cuando alguien los aprieta, y llaman al mismo
# script del VPS, así que no hay dos copias de la lógica que se desincronicen.
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'scraper/.ingest-sii-mapasui-now'

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      # Keepalives del túnel SSH. La ingesta pasa minutos trabajando sin
      # imprimir nada y el canal quedaba mudo: a los ~5 min exactos el NAT/
      # firewall del camino lo cortaba y el job moría con
      # "client_loop: send disconnect: Broken pipe" (exit 255), matando de paso
      # el `node` remoto a media ingesta. Con ServerAlive* el cliente manda
      # tráfico cada 20 s y la conexión aguanta hasta ~5 min de silencio REAL
      # del servidor antes de darla por muerta.
      SSH_OPTS: >-
        -o ServerAliveInterval=20
        -o ServerAliveCountMax=15
        -o TCPKeepAlive=yes
        -o ConnectTimeout=30
        -o BatchMode=yes
    steps:
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Un solo paso: llama al MISMO script que corre el cron del VPS cada 10
      # min. Antes esta lógica estaba duplicada acá dentro en dos bloques de
      # bash heredoc, que es como se desincronizan las cosas.
      - name: Watchdog + ingesta en el VPS
        timeout-minutes: 30
        run: |
          ssh $SSH_OPTS -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s << 'EOF'
            set -e
            cd /opt/casafari
            chmod +x scraper/sii-scraper/watchdog-ingest-sii-mapasui.sh
            # Disparo manual: esperar el lock en vez de saltarse la vuelta. Si
            # alguien aprieta el botón es porque quiere el dato ahora.
            export SII_INGEST_FLOCK_OPTS="-w 900"
            bash scraper/sii-scraper/watchdog-ingest-sii-mapasui.sh
          EOF
