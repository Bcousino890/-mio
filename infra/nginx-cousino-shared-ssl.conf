server {
    listen 80;
    server_name cousino.204-168-174-0.nip.io;

    # Reto HTTP-01 de Let's Encrypt (renovaciones)
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name cousino.204-168-174-0.nip.io;

    ssl_certificate     /etc/casafari-ssl/cousino.204-168-174-0.nip.io/fullchain.pem;
    ssl_certificate_key /etc/casafari-ssl/cousino.204-168-174-0.nip.io/privkey.pem;

    # Reverse proxy hacia el contenedor de la app en la red compartida.
    # El nombre 'casafari-cousino-app' lo resuelve Docker dentro de infrastructure_default.

    location /_next/static/ {
        proxy_pass http://casafari-cousino-app:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass         http://casafari-cousino-app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }
}
