# ─────────────────────────────────────────────────────────────────────────────
# casafari-mio · stack del VPS (Hetzner CX33 · IP 204.168.174.0)
# Infra: solo VPS + proxies. Sin Supabase, sin Vercel.
# ⚠️ El CX33 es COMPARTIDO (ya corre zinto-v2, zinto-crm, powerchat, nginx:80/443).
#    Por eso: proyecto aislado, puertos no estándar (5433/6380, solo localhost),
#    y memoria conservadora para ser buen vecino.
# Arranque completo: docker compose -p casafari --env-file ../.env up -d
# Solo DB+Redis: docker compose -p casafari --env-file ../.env up -d postgres redis
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL 16 + PostGIS ──────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: casafari-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: casafari
      POSTGRES_USER: casafari
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=24MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "max_connections=40"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/migrations:/migrations:ro
      - ../db/etl:/etl:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casafari"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: casafari-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6380:6379"

  # ── Nominatim propio (geocoding CL) ──────────────────────────────────────────
  # Self-hosted para no depender del límite de ~1 req/s del Nominatim público
  # (cuello de botella real al geocodificar millones de roles SII). Solo el
  # extracto OSM de Chile (no el planeta), no réplica/actualizaciones — basta
  # con import-once para direcciones. Primera vez tarda ~30-60 min en importar;
  # geocode-cl.ts hace fallback automático al endpoint público mientras tanto.
  nominatim:
    image: mediagis/nominatim:4.4
    container_name: casafari-nominatim
    restart: unless-stopped
    environment:
      PBF_URL: https://download.geofabrik.de/south-america/chile-latest.osm.pbf
      REPLICATION_URL: ""
      IMPORT_STYLE: street
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim}
      THREADS: 2
    volumes:
      - nominatimdata:/var/lib/postgresql/14/main
    shm_size: 1gb
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m

  # ── Next.js app (web) ─────────────────────────────────────────────────────────
  app:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: casafari-app:latest
    container_name: casafari-app
    restart: unless-stopped
    # env_file carga TODO lo que haya en el .env del VPS (DEALERNET_USER/
    # PASSWORD, OPENROUTER_API_KEY, SMARTPROXY_CL_*, CRON_SECRET, etc.) como
    # variables de entorno reales del contenedor. Antes de esto, `app` solo
    # recibía las 3 variables listadas abajo en `environment:` — cualquier
    # otra integración que lea `process.env.X` directamente (sin el fallback
    # a lectura de disco que sí tienen dealernet.ts/openrouter-config) nunca
    # veía su valor, aunque estuviera bien configurado en .env.
    env_file:
      - ../.env
    # Bind-mount (no solo env_file): las rutas de config de la UI (p.ej.
    # /api/admin/dealernet-config) escriben credenciales en `.env` en caliente
    # vía `process.cwd()/.env` para no requerir reinicio. Sin este mount ese
    # archivo vivía solo en la capa efímera del contenedor y se perdía en
    # cada deploy (docker load + recreate) — de ahí que guardar credenciales
    # "funcionara" en la UI pero la siguiente consulta a DealerNet siguiera
    # fallando con "no configurados en el entorno".
    volumes:
      - ../.env:/app/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://casafari:${POSTGRES_PASSWORD}@casafari-pg:5432/casafari
      NOMINATIM_URL: http://casafari-nominatim:8080/search
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health 2>/dev/null || wget -qO- http://localhost:3000 | head -c1 | grep -c . || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Worker 24/7 de Anuncios CL (pg-boss, plan Anuncios CL · H2) ────────────────
  # Contenedor SEPARADO de `app` a propósito: si el scraper de Chile se cuelga o
  # se satura, no debe tumbar el CRM. mem_limit explícito porque el worker NO
  # usa Playwright (ver worker-cl.mjs) — es liviano (curl+parseo+Postgres), pero
  # el CX33 es compartido y cualquier proceso 24/7 nuevo necesita un techo duro.
  worker-cl:
    build:
      context: ../scraper
      dockerfile: Dockerfile
    image: casafari-worker-cl:latest
    container_name: casafari-worker-cl
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - ../.env
    # Bind-mount ADEMÁS del env_file, por el mismo motivo que en `app`: las
    # credenciales de proxy se guardan desde la UI de Configuración, que reescribe
    # este .env en caliente. `env_file` se resuelve UNA vez, al crear el
    # contenedor, así que el worker se quedaba con las credenciales viejas para
    # siempre: guardar unas nuevas decía "Guardadas y activas" y el barrido seguía
    # fallando igual hasta el siguiente deploy. Con el archivo montado, fetch.mjs
    # lo relee en caliente (ver lib/env-vivo.mjs) y el cambio surte efecto en la
    # siguiente petición.
    volumes:
      - ../.env:/app/.env:ro
    environment:
      DATABASE_URL: postgres://casafari:${POSTGRES_PASSWORD}@casafari-pg:5432/casafari
    depends_on:
      postgres:
        condition: service_healthy
    # Sin `ports:` — es un worker de fondo, no expone HTTP.

  # ── Verificador de WhatsApp (migración 0095) ─────────────────────────────────
  # Confirma contra WhatsApp EN VIVO si los teléfonos de DealerNet siguen
  # activos y cuál es su foto de perfil actual (DealerNet entrega ambos datos
  # de su propia base, sin fecha).
  #
  # ⚠️ Arranca DESVINCULADO: sin escanear el QR no verifica nada (publica el QR
  # en whatsapp_verificador_cl.qr y espera). Leer docs/WHATSAPP-VERIFICACION.md
  # antes de vincular un número — esto viola los ToS de WhatsApp y el número
  # puede ser baneado, así que va SIEMPRE un número sacrificable.
  #
  # `profiles: [whatsapp]`: NO arranca con un `up -d` normal. Hay que pedirlo
  # explícitamente (`docker compose --profile whatsapp up -d whatsapp-verify`),
  # para que nadie encienda por accidente un proceso que arriesga un número.
  whatsapp-verify:
    profiles: ["whatsapp"]
    build:
      context: ../scraper
      dockerfile: Dockerfile.whatsapp
    image: casafari-whatsapp-verify:latest
    container_name: casafari-whatsapp-verify
    restart: unless-stopped
    mem_limit: 384m
    env_file:
      - ../.env
    volumes:
      # La sesión vinculada. Si este volumen se pierde hay que re-escanear el
      # QR, y cada re-vinculación es un evento más en el historial del número.
      - wa-auth:/app/wa-auth
    environment:
      DATABASE_URL: postgres://casafari:${POSTGRES_PASSWORD}@casafari-pg:5432/casafari
      # Ritmo conservador por defecto (ver RITMO_POR_DEFECTO en
      # lib/whatsapp-verify-cl.mjs). Subir solo si el número aguanta semanas
      # limpio, y de a poco.
      WA_VERIFY_POR_MINUTO: ${WA_VERIFY_POR_MINUTO:-15}
      WA_VERIFY_TOPE_DIARIO: ${WA_VERIFY_TOPE_DIARIO:-800}
      WA_VERIFY_TTL_DIAS: ${WA_VERIFY_TTL_DIAS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    # Sin `ports:` — worker de fondo.

volumes:
  pgdata:
  redisdata:
  nominatimdata:
  wa-auth:
