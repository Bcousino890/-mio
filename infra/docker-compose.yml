# ─────────────────────────────────────────────────────────────────────────────
# casafari-mio · stack del VPS (Hetzner CX33 · IP 204.168.174.0)
# Infra: solo VPS + proxies. Sin Supabase, sin Vercel.
# ⚠️ El CX33 es COMPARTIDO (ya corre zinto-v2, zinto-crm, powerchat, nginx:80/443).
#    Por eso: proyecto aislado, puertos no estándar (5433/6380, solo localhost),
#    y memoria conservadora para ser buen vecino.
# Arranque completo: docker compose -p casafari --env-file ../.env up -d
# Solo DB+Redis: docker compose -p casafari --env-file ../.env up -d postgres redis
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL 16 + PostGIS ──────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: casafari-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: casafari
      POSTGRES_USER: casafari
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=24MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "max_connections=40"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/migrations:/migrations:ro
      - ../db/etl:/etl:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casafari"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: casafari-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6380:6379"

  # ── Next.js app (web) ─────────────────────────────────────────────────────────
  app:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: casafari-app:latest
    container_name: casafari-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://casafari:${POSTGRES_PASSWORD}@casafari-pg:5432/casafari
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health 2>/dev/null || wget -qO- http://localhost:3000 | head -c1 | grep -c . || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Next.js app (web-cousino) — sitio público, sin DB (datos mock) ──────────
  cousino-app:
    build:
      context: ../web-cousino
      dockerfile: Dockerfile
    image: casafari-cousino-app:latest
    container_name: casafari-cousino-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 | head -c1 | grep -c . || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
  redisdata:
