# ─────────────────────────────────────────────────────────────────────────────
# Proxy snippet reutilizable — incluido tanto por el bloque HTTP como HTTPS
# INSTALAR: cp ... /etc/nginx/snippets/casafari-proxy.conf
# ─────────────────────────────────────────────────────────────────────────────

# Logs separados — no mezclan con zintoleads ni otros stacks
access_log /var/log/nginx/casafari-access.log;
error_log  /var/log/nginx/casafari-error.log warn;

# Assets Next.js — cache inmutable (el hash en el nombre cambia en cada build)
location /_next/static/ {
    proxy_pass http://casafari_app;
    add_header Cache-Control "public, max-age=31536000, immutable";
    proxy_set_header Host $host;
}

# Fotos y archivos estáticos — cache 30 días
location /photos/ {
    proxy_pass http://casafari_app;
    add_header Cache-Control "public, max-age=2592000";
    proxy_set_header Host $host;
}

# Leaflet icons
location /leaflet/ {
    proxy_pass http://casafari_app;
    add_header Cache-Control "public, max-age=2592000";
    proxy_set_header Host $host;
}

# App principal (SSR + client-side navigation)
location / {
    proxy_pass         http://casafari_app;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade            $http_upgrade;
    proxy_set_header   Connection         "upgrade";
    proxy_set_header   Host               $host;
    proxy_set_header   X-Real-IP          $remote_addr;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto  $scheme;
    proxy_read_timeout 60s;
    proxy_buffering    off;
}
