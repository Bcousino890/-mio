server {
    listen 80;
    server_name crm.cremme.es;

    # Reverse proxy hacia el contenedor de la app en la red compartida.
    # El nombre 'casafari-app' lo resuelve Docker dentro de infrastructure_default.

    # Reto HTTP-01 de Let's Encrypt (ver infra/ensure-tls.sh)
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location /_next/static/ {
        proxy_pass http://casafari-app:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    location /photos/ {
        proxy_pass http://casafari-app:3000;
        add_header Cache-Control "public, max-age=2592000";
        proxy_set_header Host $host;
    }

    location /leaflet/ {
        proxy_pass http://casafari-app:3000;
        add_header Cache-Control "public, max-age=2592000";
        proxy_set_header Host $host;
    }

    # Ver nota en nginx-casafari-shared-ssl.conf — mismos límites elevados
    # para la subida de archivos SII, por si este conf http-only queda activo
    # transitoriamente (ver infra/ensure-tls.sh).
    location /api/admin/sii-upload {
        client_max_body_size 21G;
        client_body_timeout  21600s;
        proxy_pass         http://casafari-app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 21600s;
        proxy_send_timeout 21600s;
        proxy_buffering    off;
    }

    # Ver nota equivalente en nginx-casafari-shared-ssl.conf.
    location /api/admin/catastral-cl-parquet {
        client_max_body_size 3G;
        proxy_pass         http://casafari-app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 21600s;
        proxy_send_timeout 21600s;
        proxy_buffering    off;
    }

    # Ver nota en nginx-casafari-shared-ssl.conf: TGR (~30-60s, Chromium)
    # necesita más que los 60s del location / genérico de abajo.
    location /api/chile/captar {
        proxy_pass         http://casafari-app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 150s;
        proxy_buffering    off;
    }

    location / {
        proxy_pass         http://casafari-app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }
}
