server {
    listen 80;
    server_name 204-168-174-0.nip.io;

    # Reverse proxy hacia el contenedor de la app en la red compartida.
    # El nombre 'casafari-app' lo resuelve Docker dentro de infrastructure_default.

    location /_next/static/ {
        proxy_pass http://casafari-app:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    location /photos/ {
        proxy_pass http://casafari-app:3000;
        add_header Cache-Control "public, max-age=2592000";
        proxy_set_header Host $host;
    }

    location /leaflet/ {
        proxy_pass http://casafari-app:3000;
        add_header Cache-Control "public, max-age=2592000";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass         http://casafari-app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }
}
