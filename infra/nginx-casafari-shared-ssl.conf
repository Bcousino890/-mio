server {
    listen 80;
    server_name crm.cremme.es;

    # Reto HTTP-01 de Let's Encrypt (renovaciones)
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name crm.cremme.es;

    ssl_certificate     /etc/casafari-ssl/crm.cremme.es/fullchain.pem;
    ssl_certificate_key /etc/casafari-ssl/crm.cremme.es/privkey.pem;

    # Reverse proxy hacia el contenedor de la app en la red compartida.
    # El nombre 'casafari-app' lo resuelve Docker dentro de infrastructure_default.

    location /_next/static/ {
        proxy_pass http://casafari-app:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    location /photos/ {
        proxy_pass http://casafari-app:3000;
        add_header Cache-Control "public, max-age=2592000";
        proxy_set_header Host $host;
    }

    location /leaflet/ {
        proxy_pass http://casafari-app:3000;
        add_header Cache-Control "public, max-age=2592000";
        proxy_set_header Host $host;
    }

    # Subida de archivos planos del SII (Detalle Catastral + Rol de Cobro):
    # hasta 10GB por archivo / 20GB por subida (ver MAX_FILE_BYTES /
    # MAX_TOTAL_BYTES en route.ts) y la ingesta (cientos de miles de filas)
    # puede tardar horas en comunas grandes — el location / de abajo usa los
    # límites por defecto de nginx (1MB de body, 60s de read timeout),
    # insuficientes acá.
    location /api/admin/sii-upload {
        client_max_body_size 21G;
        client_body_timeout  21600s;
        proxy_pass         http://casafari-app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 21600s;
        proxy_send_timeout 21600s;
        proxy_buffering    off;
    }

    # Ingesta de GeoParquet de catastral.cl: descarga un .zip grande desde
    # Drive (sin progreso intermedio durante la descarga) o sube el archivo
    # directo (/from-file, hasta 2GiB) y luego procesa ~120 comunas con
    # Python/geopandas — todo puede tardar varios minutos, más que el
    # proxy_read_timeout de 60s del location / genérico de abajo.
    location /api/admin/catastral-cl-parquet {
        client_max_body_size 3G;
        proxy_pass         http://casafari-app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 21600s;
        proxy_send_timeout 21600s;
        proxy_buffering    off;
    }

    # Panel genérico de subida de archivos grandes (hasta 50GB, streaming busboy):
    location /api/admin/upload-raw {
        client_max_body_size 51G;
        client_body_timeout  21600s;
        proxy_pass         http://casafari-app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 21600s;
        proxy_send_timeout 21600s;
        proxy_buffering    off;
    }

    # Carga de polígonos prediales (Parquet/GeoPackage/ZIP de catastral.cl):
    # hasta 11GB (ZIP con 121 comunas ~5-10GB) y procesamiento largo con Python.
    location /api/admin/load-parcels {
        client_max_body_size 11G;
        client_body_timeout  21600s;
        proxy_pass         http://casafari-app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 21600s;
        proxy_send_timeout 21600s;
        proxy_buffering    off;
    }

    location / {
        proxy_pass         http://casafari-app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }
}
