# ─────────────────────────────────────────────────────────────────────────────
# casafari-mio · nginx server block
# Pegar en: /etc/nginx/conf.d/casafari.conf
# Después: nginx -t && systemctl reload nginx
#
# URL temporal (sin dominio):  http://204.168.174.0
# Con dominio: cambiar server_name y añadir el bloque SSL de Certbot.
# ─────────────────────────────────────────────────────────────────────────────

upstream casafari_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name 204.168.174.0 mio.tudominio.com;   # ajustar cuando haya dominio

    # Logs separados para no mezclar con otros stacks
    access_log /var/log/nginx/casafari-access.log;
    error_log  /var/log/nginx/casafari-error.log warn;

    # Archivos estáticos de Next.js — cache agresivo
    location /_next/static/ {
        proxy_pass http://casafari_app;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    # Fotos y assets públicos
    location /photos/ {
        proxy_pass http://casafari_app;
        add_header Cache-Control "public, max-age=2592000";
        proxy_set_header Host $host;
    }

    # Todo lo demás → Next.js (SSR / client-side)
    location / {
        proxy_pass http://casafari_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
