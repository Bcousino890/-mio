# ─────────────────────────────────────────────────────────────────────────────
# casafari-mio · nginx server block
#
# DOMINIOS GRATIS configurados (elige / usa los que quieras):
#   • 204-168-174-0.nip.io        ← funciona YA, sin registrar nada (nip.io = DNS comodín)
#   • casafari-mio.duckdns.org    ← nombre bonito, gratis en https://duckdns.org (30s)
#   • mio.zinto.app               ← tu propio subdominio (si añades el registro A)
#
# INSTALAR:
#   cp /opt/casafari/infra/nginx-casafari-proxy.conf /etc/nginx/snippets/casafari-proxy.conf
#   cp /opt/casafari/infra/nginx-casafari.conf       /etc/nginx/conf.d/casafari.conf
#   nginx -t && systemctl reload nginx
#
# TLS GRATIS (Certbot) — usa cualquiera de los nombres de arriba:
#   certbot --nginx -d 204-168-174-0.nip.io
#   certbot --nginx -d casafari-mio.duckdns.org
# ─────────────────────────────────────────────────────────────────────────────

upstream casafari_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # Responde a cualquiera de estos nombres gratis (no afecta a zintoleads):
    server_name 204-168-174-0.nip.io casafari-mio.duckdns.org mio.zinto.app;

    include /etc/nginx/snippets/casafari-proxy.conf;
}

