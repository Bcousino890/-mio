# ─────────────────────────────────────────────────────────────────────────────
# casafari-mio · nginx server block
# Subdominio: mio.zinto.app  (o el que prefieras)
#
# INSTALAR:
#   cp /opt/casafari/infra/nginx-casafari.conf /etc/nginx/conf.d/casafari.conf
#   nginx -t && systemctl reload nginx
#
# TLS GRATIS (Certbot):
#   certbot --nginx -d mio.zinto.app
# ─────────────────────────────────────────────────────────────────────────────

upstream casafari_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ── HTTP → redirigir a HTTPS una vez configurado Certbot ─────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mio.zinto.app;          # ← cambiar si el subdominio es otro

    # Certbot añadirá aquí el redirect automático al hacer --nginx
    # Mientras no haya TLS, sirve directamente en HTTP:
    include /etc/nginx/snippets/casafari-proxy.conf;
}

